<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paid AI Models - AI Model Price Tracker</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Paid AI Models</h1>
            <div id="nav-container"></div>
            <div class="controls">
                <button id="theme-toggle" aria-label="Toggle dark/light theme">Theme</button>
                <select id="provider-filter" aria-label="Filter by provider">
                    <option value="">All Providers</option>
                </select>
                <select id="policy-filter" aria-label="Filter by data policy">
                    <option value="">All Policies</option>
                    <option value="restricted">Restricted</option>
                    <option value="mixed">Mixed</option>
                    <option value="community">Community</option>
                    <option value="unknown">Unknown</option>
                </select>
                <input type="search" id="model-search" placeholder="Search paid models..." aria-label="Search models">
            </div>
        </div>
    </header>

    <main>
        <div class="page-header">
            <p>Paid models available on OpenRouter. Sorted by context efficiency (tokens per dollar).</p>
        </div>
        <div id="chart-container"></div>
        <div id="table-container"></div>
    </main>

    <footer>
        <p>Data from <a href="https://openrouter.ai/" target="_blank" rel="noopener noreferrer">OpenRouter</a></p>
        <p><a href="https://github.com/MrSpaghatti/ai-model-tracker" target="_blank" rel="noopener noreferrer">GitHub</a></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.30/dist/uPlot.iife.min.js" defer></script>
    <script src="assets/shared.js" defer></script>
    <script src="assets/nav.js" defer></script>
    <script src="assets/paid.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            AIMTNav.initNav('nav-container', 'paid.html');
        });
    </script>
</body>
</html>
